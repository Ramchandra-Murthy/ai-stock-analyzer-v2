# SonarQube Cloud project configuration for the supported EROS runtime.
sonar.projectKey=Ramchandra-Murthy_AI_STOCK_ANALYZER
sonar.projectName=AI_STOCK_ANALYZER
sonar.sources=.
sonar.python.version=3.13

# Historical snapshots and backups are retained for provenance, not runtime.
# They must not participate in the production quality gate.
sonar.exclusions=archive/**,**/*.bak,**/__pycache__/**,.venv/**,build/**,dist/**
sonar.coverage.exclusions=archive/**,**/*.bak,tests/**
