# SonarQube Cloud automatic-analysis configuration.
# Keep this file aligned with the supported Python runtime and repository layout.
sonar.sources=.
sonar.python.version=3.13
sonar.sourceEncoding=UTF-8

# Tests are stored in the tests/ directory.
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

# Historical snapshots and backups are retained for provenance, not runtime.
sonar.exclusions=archive/**,backup_before_v2/**,**/*.bak,**/__pycache__/**,.venv/**,build/**,dist/**
sonar.coverage.exclusions=archive/**,backup_before_v2/**,**/*.bak,tests/**
