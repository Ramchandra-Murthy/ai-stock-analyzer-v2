[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-stock-analyzer"
version = "0.6.0"
description = "AI-powered stock analysis and valuation platform"
requires-python = ">=3.13,<3.14"
dependencies = [
    "streamlit==1.63.0",
    "fastapi==0.116.1",
    "yfinance==1.7.0",
    "dhanhq==2.2.0",
    "pandas==3.0.5",
    "numpy==2.2.6",
    "plotly==7.0.0",
    "scikit-learn==1.9.1",
    "pandas_ta==0.4.71b0",
    "python-dotenv==1.2.3",
    "pydantic==2.13.5",
    "openpyxl==3.1.5",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
    "black==26.5.1",
    "mypy==2.3.1",
    "mkdocs==1.6.1",
    "build==1.3.0",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
pythonpath = ["."]
testpaths = ["tests"]


[tool.black]
line-length = 100
target-version = ["py313"]
exclude = '/(\.eggs|\.git|\.venv|build|dist|archive|backup_before_v2)/'

# EROS CI validation trigger after automated Black repair.
