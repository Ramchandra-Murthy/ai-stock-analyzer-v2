name: Generate uv lockfile

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"

      - name: Generate and validate lockfile
        run: uv lock --python 3.13

      - name: Commit lockfile if changed
        run: |
          if git status --porcelain -- uv.lock | grep -q '^'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "Add resolved uv lockfile"
            git push
          else
            echo "uv.lock is already current"
          fi
