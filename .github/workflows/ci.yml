name: CI

on:
  push:
    branches: [ main, develop, 'feat/**' ]
  pull_request:
    branches: [ main, develop, 'feat/**' ]
  workflow_dispatch:

# EROS: canonical CI gate for the supported repaired runtime surface.
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "0.12.1"
    - name: Install locked dependencies
      run: uv sync --locked --no-build --no-install-project
    - name: Lint with Ruff
      run: uv run --locked --no-sync --no-build ruff check .
    - name: Check formatting with Black
      run: uv run --locked --no-sync --no-build black --check --diff --force-exclude '(^|/)(\\.venv|venv|archive|backup_before_v2)/' .
    - name: Type check supported runtime surface
      run: >-
        uv run --locked --no-sync --no-build mypy
        services/ai_service.py
        services/fundamental_score_service.py
        services/recommendation_service.py
        services/score_service.py
        services/target_price_service.py
        services/technical_score_service.py
        services/trade_plan_service.py
        services/ui_formatters.py
        services/symbol_resolver.py
        services/price_table.py
        scanner/gainers.py
        algorithmic_trading/lab_inputs.py
        algorithmic_trading/concentration.py
        algorithmic_trading/portfolio_advanced.py
        algorithmic_trading/portfolio_tools.py
        algorithmic_trading/risk_advanced.py
        algorithmic_trading/execution.py
        algorithmic_trading/attribution.py
        algorithmic_trading/risk_guards.py
        algorithmic_trading/ml_diagnostics.py
    - name: Test repaired contracts and market-data boundaries
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: >-
        uv run --locked --no-sync --no-build python -m pytest --import-mode=importlib -q
        tests/test_repaired_contracts.py
        tests/test_market_data_boundary.py
        tests/test_backtester.py
        tests/test_walk_forward_validation.py
        tests/test_watchlist_*.py
        tests/forecast
    - name: Build production Docker image
      run: docker build --pull -t ai-stock-analyzer:ci .
    - name: Smoke test container runtime health
      run: |
        set -e
        docker run -d --rm --name ai-stock-analyzer-ci -p 8501:8501 ai-stock-analyzer:ci
        trap 'docker logs ai-stock-analyzer-ci || true; docker stop ai-stock-analyzer-ci || true' EXIT
        for i in $(seq 1 30); do
          if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
            echo "Streamlit health endpoint is healthy"
            exit 0
          fi
          sleep 2
        done
        echo "Streamlit health endpoint did not become healthy"
        exit 1

  # Informational only: runs the whole tests/ directory without gating merges.
  # The gating job above runs a curated subset; use this to spot regressions elsewhere
  # and promote files into the gating list once they are reliably green.
  full-test-suite:
    name: Full test suite (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "0.12.1"
    - name: Install locked dependencies
      run: uv sync --locked --no-build --no-install-project
    - name: Run entire test suite
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: uv run --locked --no-sync --no-build python -m pytest --import-mode=importlib -q tests
