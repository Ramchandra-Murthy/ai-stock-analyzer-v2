name: Documentation

on:
  push:
    branches: [ main ]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "0.12.1"
    - name: Install locked documentation tooling
      run: uv sync --locked --only-dev --no-build
    - name: Build documentation
      run: uv run --locked --no-build mkdocs build || echo "MkDocs config pending"
