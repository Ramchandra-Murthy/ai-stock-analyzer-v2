name: Regenerate Dhan lockfile

on:
  push:
    branches: [feat/pin-dhanhq-dependency]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.1"
      - name: Regenerate lockfile from pyproject
        run: |
          rm -f uv.lock
          uv lock
      - name: Validate locked install
        run: uv sync --locked --no-build --no-install-project
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git diff --cached --quiet && exit 0
          git commit -m "chore: regenerate uv lockfile"
          git push
